name: habit_tracker
description: >-
  个人习惯打卡平台（纯 Web）：基于 MicroFlow4Flutter 解释运行模式的
  声明式前端。打卡数据落 localStorage，运营事件经框架遥测管道写入
  同源共享日志，供 ops_admin 管理平台收集。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  microflow4_flutter:
    path: ../../
  mf_platform_store:
    path: ../mf_platform_store

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
