name: microflow4_flutter
description: >-
  MicroFlow Frontend 的 Flutter 实现总包：组合 model、runtime、observability 与
  renderer_flutter 四个模块。总包只做装配与再导出，模块可以独立升级。
version: 0.3.0
publish_to: none
environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  microflow_model:
    path: packages/microflow_model
  microflow_runtime:
    path: packages/microflow_runtime
  microflow_observability:
    path: packages/microflow_observability
  microflow_renderer_flutter:
    path: packages/microflow_renderer_flutter
  microflow_authoring:
    path: packages/microflow_authoring
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
