[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microflow-registry"
version = "0.1.0"
description = "MicroFlow registration projection: publish-snapshot metadata for support platforms, idempotent by content digest"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.scripts]
microflow-registry = "microflow_registry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
