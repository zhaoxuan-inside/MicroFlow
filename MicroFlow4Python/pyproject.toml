[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microflow4python"
version = "0.1.0"
description = "Contract-driven Python operators and durable workflow protocols"
requires-python = ">=3.12"
dependencies = []
license = "MIT"

[project.scripts]
microflow = "microflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
microflow = ["py.typed"]
