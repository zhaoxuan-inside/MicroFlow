name: support-platforms
on:
  push:
    paths: ["MicroFlow4Orchestration/**", "MicroFlow4Ops/**", "MicroFlow4Bizops/**", "MicroFlow4Kit/**", ".github/workflows/support-platforms.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [MicroFlow4Orchestration, MicroFlow4Ops, MicroFlow4Bizops]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install kit deps
        run: npm install --prefix MicroFlow4Kit --no-bin-links
      - name: Install app deps
        run: npm install --prefix ${{ matrix.app }} --no-bin-links
      - name: Typecheck & build
        run: |
          cd ${{ matrix.app }}
          node node_modules/typescript/bin/tsc -b
          node node_modules/vite/bin/vite.js build
      - name: Pure logic tests
        run: npm test --prefix ${{ matrix.app }} --if-present
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install server deps
        run: pip install -r MicroFlow4Orchestration/server/requirements.txt pytest
      - name: Server app imports and mounts
        run: |
          cd MicroFlow4Orchestration/server
          python -c "from app.main import app; assert len(app.routes) > 50"
      - name: Pure logic tests (integration needs PostgreSQL, skipped honestly)
        run: |
          cd MicroFlow4Orchestration/server
          python -m pytest tests/ -q
