[project]
name = "microflow4host"
version = "0.1.0"
description = "MicroFlow 宿主参考实现：dispatch 单端点网关 + 最小治理 + RBAC 目录 + 遥测接收 + ops/bizops 聚合 + SPA 托管 + scaffold。"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
microflow-host = "host.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
